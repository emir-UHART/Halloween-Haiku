<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme in Yellow - Evan Mir Halloween Project</title>
    <!-- Tailwind CSS for UI Controls -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- STEP 4: Google Fonts (Cinzel & Playfair Display - 400 and 600 Weights) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- STEP 4: CSS Declarations --- */
        h1, h2, h3, .font-heading {
            font-family: 'Cinzel', serif;
            font-weight: 600;
        }

        body, p, .font-body {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
        }

        /* Container Background Color Rule */
        .container-box {
            background-color: #120e08;
        }

        /* Responsive Background Image & Image Scaling Rules */
        .responsive-bg {
            background-image: linear-gradient(to bottom, rgba(10, 8, 4, 0.45), rgba(10, 8, 4, 0.75)), url('images/background.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-color: #120e08;
        }

        /* Responsive Image Rule as required in STEP 4 */
        .responsive-img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0804;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 antialiased min-h-screen flex flex-col">

    <!-- Top Viewport Switcher Bar -->
    <header class="bg-stone-950/95 border-b border-amber-500/30 sticky top-0 z-50 py-3 px-4 shadow-2xl backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-crown text-amber-400 text-xl"></i>
                <h1 class="text-base md:text-lg font-bold text-amber-400 tracking-wider">
                    Evan_Mir_Halloween Project
                </h1>
            </div>
            
            <!-- View Selector Tabs -->
            <div class="flex flex-wrap justify-center gap-2 bg-stone-900 p-1.5 rounded-xl border border-amber-900/40 text-xs md:text-sm font-medium">
                <button onclick="switchTab('live')" id="tab-live" class="tab-btn px-4 py-2 rounded-lg transition-all duration-200 flex items-center gap-2 bg-amber-500 text-stone-950 font-bold shadow-md">
                    <i class="fa-solid fa-eye"></i> Live Webpage
                </button>
                <button onclick="switchTab('wireframe')" id="tab-wireframe" class="tab-btn px-4 py-2 rounded-lg transition-all duration-200 flex items-center gap-2 text-stone-400 hover:text-amber-300 hover:bg-stone-800">
                    <i class="fa-solid fa-desktop"></i> Desktop Wireframe (1200px)
                </button>
                <button onclick="switchTab('prep')" id="tab-prep" class="tab-btn px-4 py-2 rounded-lg transition-all duration-200 flex items-center gap-2 text-stone-400 hover:text-amber-300 hover:bg-stone-800">
                    <i class="fa-solid fa-file-code"></i> CSS Prep & Folder Setup
                </button>
            </div>
        </div>
    </header>

             =================================================================== -->

                <div class="container-box w-full max-w-[1200px] rounded-2xl overflow-hidden border border-amber-500/40 shadow-2xl backdrop-blur-sm">
